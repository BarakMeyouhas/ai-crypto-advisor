<div class="login-container">
  <button class="theme-toggle" (click)="themeService.toggleTheme()" title="Toggle Theme">
    <svg *ngIf="(themeService.isDarkMode$ | async)" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg *ngIf="!(themeService.isDarkMode$ | async)" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <div class="glass-card login-card">
    <h2 class="text-center">{{ isLoginMode ? 'Welcome Back' : 'Create Account' }}</h2>
    <p class="subtitle text-center">AI-curated crypto insights just for you</p>

    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <form (ngSubmit)="onSubmit()">
      <input 
        *ngIf="!isLoginMode"
        type="text" 
        name="name" 
        placeholder="Full Name" 
        [(ngModel)]="formData.name" 
        required
      />
      <input 
        type="email" 
        name="email" 
        placeholder="Email Address" 
        [(ngModel)]="formData.email" 
        required
      />
      <input 
        type="password" 
        name="password" 
        placeholder="Password" 
        [(ngModel)]="formData.password" 
        required
      />

      <button type="submit" class="btn-primary">
        {{ isLoginMode ? 'Login' : 'Sign Up' }}
      </button>
    </form>

    <div class="switch-mode">
      <button type="button" class="btn-secondary" (click)="switchMode()">
        {{ isLoginMode ? 'Need an account? Sign up' : 'Already have an account? Login' }}
      </button>
    </div>
  </div>
</div>
