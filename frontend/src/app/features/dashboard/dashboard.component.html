<div class="dashboard-layout" [class.collapsed]="isSidebarCollapsed">
  <!-- SIDEBAR -->
  <aside class="sidebar glass-card">
    <div class="sidebar-header">
      <h2 *ngIf="!isSidebarCollapsed">Crypto AI</h2>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <svg *ngIf="!isSidebarCollapsed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="11 17 6 12 11 7"></polyline>
          <polyline points="18 17 13 12 18 7"></polyline>
        </svg>
        <svg *ngIf="isSidebarCollapsed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
      </button>
    </div>

    <div class="sidebar-nav">
      <button class="nav-btn active" (click)="goToDashboard()">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 14l-4-4"></path>
            <path d="M3.34 16a10 10 0 1 1 17.32 0"></path>
            <circle cx="12" cy="14" r="2"></circle>
            <path d="M2 16h20"></path>
          </svg>
        </span>
        <span class="text" *ngIf="!isSidebarCollapsed">Dashboard</span>
      </button>
      <button class="nav-btn" (click)="goToSettings()">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </span>
        <span class="text" *ngIf="!isSidebarCollapsed">Settings</span>
      </button>
    </div>

    <div class="sidebar-footer">
      <button class="nav-btn" (click)="themeService.toggleTheme()">
        <span class="icon">
          <!-- Sun icon when dark mode, Moon icon when light mode -->
          <svg *ngIf="(themeService.isDarkMode$ | async)" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg *ngIf="!(themeService.isDarkMode$ | async)" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="text" *ngIf="!isSidebarCollapsed">Toggle Theme</span>
      </button>

      <button class="nav-btn logout" (click)="logout()">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </span>
        <span class="text" *ngIf="!isSidebarCollapsed">Logout</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="dashboard-main">
    <div class="loading-container" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Loading your dashboard...</p>
    </div>

    <ng-container *ngIf="!isLoading">
      <header class="dashboard-header">
        <div class="header-top">
          <h1>Welcome, {{userName}}</h1>
        </div>
        <p class="subtitle">Your customized AI-curated crypto insights</p>
      </header>

      <div class="dashboard-grid">
        <app-prices-widget *ngIf="hasContent('prices')" [assets]="userPreferences?.interestedAssets || []"></app-prices-widget>
        <app-news-widget *ngIf="hasContent('news')"></app-news-widget>
        <app-insight-widget *ngIf="hasContent('ai')"></app-insight-widget>
        <app-meme-widget *ngIf="hasContent('memes')"></app-meme-widget>
      </div>
    </ng-container>
  </main>
</div>
