<div class="glass-card widget-card">
  <h3>🧠 AI Insight of the Day</h3>
  
  <div class="loader-container" *ngIf="isLoading; else content">
    <div class="spinner"></div>
    <div>Generating personalized LLM insight...</div>
  </div>

  <ng-template #content>
    <div class="insight-content" *ngIf="insight; else noData">
      <p>{{ insight }}</p>
    </div>
    
    <ng-template #noData>
      <div class="placeholder-content">No insight available today.</div>
    </ng-template>
  </ng-template>

  <div class="feedback-actions" *ngIf="!isLoading && insight">
    <button class="btn-icon" (click)="vote(true)" [disabled]="voteState !== null" [class.voted]="voteState === true">👍</button>
    <button class="btn-icon" (click)="vote(false)" [disabled]="voteState !== null" [class.voted]="voteState === false">👎</button>
  </div>
</div>
